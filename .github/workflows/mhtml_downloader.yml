name: MHTML ذخیره صفحه به 


on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the webpage to download'
        required: true
        type: string
      title:
        description: 'Optional title for the output file (no spaces/special chars)'
        required: false
        type: string

        
permissions:
  contents: write


jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install "playwright==1.65.2"
          python -m playwright install --with-deps --only-shell chromium

      - name: Run MHTML downloader
        env:
          WF_GITHUB_EVENT_INPUTS_URL: ${{ github.event.inputs.url }}
          WF_GITHUB_EVENT_INPUTS_TITLE: ${{ github.event.inputs.title }}
        run: |
          python save_as_mhtml.py --url "$WF_GITHUB_EVENT_INPUTS_URL" --title "$WF_GITHUB_EVENT_INPUTS_TITLE"



      - name: Commit and push download folder to repo
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WF_GITHUB_EVENT_INPUTS_URL: ${{ github.event.inputs.url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add download/
          python3 scripts/check_staged_sizes.py
          git diff --cached --quiet || git commit -m "Add MHTML archive [skip ci]"
          bash scripts/push_current_branch.sh