name: "Spotify & SoundCloud Downloader"

on:
  workflow_dispatch:
    inputs:
      media_url:
        description: "Spotify or SoundCloud URL"
        required: true
        type: string

      output_format:
        description: "Output Format"
        required: true
        type: choice
        options:
          - mp3
          - flac
        default: mp3

      audio_quality:
        description: "Audio Quality"
        required: true
        type: choice
        options:
          - 128k
          - 192k
          - 320k
        default: 320k

      max_part_mb:
        description: "Max Part Size (MB)"
        required: false
        type: string
        default: "90"

      upload_method:
        description: "Upload Method"
        required: true
        type: choice
        options:
          - repository
          - release
        default: repository

      release_tag:
        description: "Release Tag"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  media-download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate inputs
        env:
          URL: ${{ inputs.media_url }}
          SIZE: ${{ inputs.max_part_mb }}
          METHOD: ${{ inputs.upload_method }}
        run: |
          MAX_SIZE=95
          if [[ "$METHOD" == release* ]]; then MAX_SIZE=1900; fi
          python3 scripts/validate_workflow.py --url "$URL" --size "$SIZE" --max-size "$MAX_SIZE"

      - name: Identify media provider
        id: media
        env:
          URL: ${{ inputs.media_url }}
        run: python3 scripts/media_provider.py "$URL" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        shell: bash
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y \
            ffmpeg \
            curl \
            jq \
            zip \
            python3 \
            python3-pip

          python -m pip install --quiet "yt-dlp[default]" "spotdl==4.6.0"
          # PyPI mirror may still serve vulnerable Soup Sieve 2.x. 4.1.1 fixes
          # GHSA-mmhr-3c5m-f64f and related parser DoS issues.
          python -m pip install --quiet --no-deps --force-reinstall \
            'soupsieve @ git+https://github.com/facelessuser/soupsieve.git@7d028fdebbb7261849ee0c2a352b602ef70b7b14'
          python scripts/check_soupsieve.py

      - name: Create Download Folder
        shell: bash
        run: |
          mkdir -p release_files

      - name: Download Spotify Media
        if: steps.media.outputs.provider == 'spotify'
        env:
          URL: ${{ inputs.media_url }}
          FORMAT: ${{ inputs.output_format }}
          QUALITY: ${{ inputs.audio_quality }}
        run: |
          # spotDL matches Spotify metadata to audio from another provider.
          spotdl download "$URL" --yt-dlp-args="--js-runtimes node" --format "$FORMAT" --bitrate "$QUALITY" --output 'release_files/{artist} - {title}.{output-ext}'

      - name: Download SoundCloud Media
        if: steps.media.outputs.provider == 'soundcloud'
        shell: bash
        env:
          WF_GITHUB_EVENT_INPUTS_MEDIA_URL: ${{ github.event.inputs.media_url }}
          WF_GITHUB_EVENT_INPUTS_OUTPUT_FORMAT: ${{ github.event.inputs.output_format }}
          WF_GITHUB_EVENT_INPUTS_AUDIO_QUALITY: ${{ github.event.inputs.audio_quality }}
        run: |
          URL="${WF_GITHUB_EVENT_INPUTS_MEDIA_URL}"
          FORMAT="${WF_GITHUB_EVENT_INPUTS_OUTPUT_FORMAT}"
          QUALITY="${WF_GITHUB_EVENT_INPUTS_AUDIO_QUALITY}"

          echo "SoundCloud detected"

          yt-dlp \
            -x \
            --audio-format "$FORMAT" \
            --audio-quality "$QUALITY" \
            -o "release_files/%(title)s.%(ext)s" \
            "$URL"

      - name: Validate Download
        shell: bash
        run: |
          FILE_COUNT=$(find release_files -type f | wc -l)

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No files downloaded"
            exit 1
          fi

          echo "Downloaded files:"
          ls -lh release_files/

      - name: Split Large Files
        shell: bash
        env:
          WF_GITHUB_EVENT_INPUTS_MAX_PART_MB: ${{ github.event.inputs.max_part_mb }}
        run: |
          THRESH_MB="${WF_GITHUB_EVENT_INPUTS_MAX_PART_MB}"

          if [[ "$THRESH_MB" -le 0 || "$THRESH_MB" -gt 1900 ]]; then
            THRESH_MB=1800
          fi

          cd release_files || exit 1

          for FILE in *; do
            [ -f "$FILE" ] || continue

            FILESIZE=$(stat -c%s -- "$FILE")
            THRESH_BYTES=$((THRESH_MB * 1024 * 1024))

            if [ "$FILESIZE" -gt "$THRESH_BYTES" ]; then
              echo "Splitting: $FILE"

              # Include the extension to distinguish same-title files of different formats.
              ARCHIVE="./${FILE}.zip"
              shopt -s nullglob
              parts=("./${FILE}".z[0-9]*)
              if [ -e "$ARCHIVE" ] || [ "${#parts[@]}" -gt 0 ]; then
                echo "::error::Archive or split parts already exist: $ARCHIVE"; exit 1
              fi
              zip -r -s "${THRESH_MB}m" "$ARCHIVE" -- "./$FILE"

              rm -f -- "$FILE"
            fi
          done

          cd ..

      - name: Get Current Date
        id: get_date
        shell: bash
        run: |
          echo "date=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Push to Repository
        if: github.event.inputs.upload_method == 'repository'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p downloads

          python3 scripts/move_outputs.py release_files downloads

          git add downloads/
          python3 scripts/check_staged_sizes.py

          git diff --cached --quiet || git commit -m "Media Download [skip ci]"

          bash scripts/push_current_branch.sh

      - name: Upload to GitHub Releases
        if: github.event.inputs.upload_method == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || format('media-{0}', github.run_number) }}
          name: "Spotify & SoundCloud Download"
          body: |
            Media Download Complete

            URL: ${{ github.event.inputs.media_url }}
            Format: ${{ github.event.inputs.output_format }}
            Quality: ${{ github.event.inputs.audio_quality }}
            Downloaded on: ${{ steps.get_date.outputs.date }}

            Powered by Meli-Action ⚡
          files: release_files/*

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf release_files
