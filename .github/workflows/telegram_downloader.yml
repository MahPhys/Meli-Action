name: تلگرام دانلودر

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: '🔗 Telegram post link (e.g., https://t.me/channel/123)'
        required: true
        type: string
      split_threshold_mb:
        description: '📦 Maximum file size per part (MB) – set 0 to disable splitting'
        required: false
        type: string
        default: '90'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📂 Clone repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Validate inputs
        env:
          URL: ${{ inputs.telegram_link }}
          SIZE: ${{ inputs.split_threshold_mb }}
        run: |
          python3 scripts/validate_workflow.py --url "$URL" --size "$SIZE" --allow-zero

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq zip unzip openssl python3 python3-pip

      - name: 🐍 Install Python dependencies
        run: pip3 install requests

      - name: 📥 Download Telegram file
        id: download
        env:
          WF_GITHUB_EVENT_INPUTS_TELEGRAM_LINK: ${{ github.event.inputs.telegram_link }}
        run: |
          OUTPUT_DIR="$RUNNER_TEMP/meli-telegram"
          mkdir -p "$OUTPUT_DIR"
          python3 telegram_downloader.py "${WF_GITHUB_EVENT_INPUTS_TELEGRAM_LINK}" "$OUTPUT_DIR"
          if [ -f "$OUTPUT_DIR/.download_info" ]; then
            FILENAME=$(head -n1 "$OUTPUT_DIR/.download_info")
            FILESIZE=$(tail -n1 "$OUTPUT_DIR/.download_info")
            echo "downloaded_name=$FILENAME" >> $GITHUB_OUTPUT
            echo "file_size=$FILESIZE" >> $GITHUB_OUTPUT
            rm "$OUTPUT_DIR/.download_info"
          else
            echo "❌ Download failed"
            exit 1
          fi

      - name: ✂️ Split large file (if needed)
        if: github.event.inputs.split_threshold_mb != '0'
        env:
          WF_GITHUB_EVENT_INPUTS_SPLIT_THRESHOLD_MB: ${{ github.event.inputs.split_threshold_mb }}
          WF_STEPS_DOWNLOAD_OUTPUTS_DOWNLOADED_NAME: ${{ steps.download.outputs.downloaded_name }}
          WF_STEPS_DOWNLOAD_OUTPUTS_FILE_SIZE: ${{ steps.download.outputs.file_size }}
        run: |
          THRESHOLD="${WF_GITHUB_EVENT_INPUTS_SPLIT_THRESHOLD_MB}"
          FILENAME="${WF_STEPS_DOWNLOAD_OUTPUTS_DOWNLOADED_NAME}"
          FILE_SIZE="${WF_STEPS_DOWNLOAD_OUTPUTS_FILE_SIZE}"
          LIMIT=$((THRESHOLD * 1024 * 1024))

          if [ -n "$FILE_SIZE" ] && [ "$FILE_SIZE" -gt "$LIMIT" ]; then
            echo "✂️ File (${FILE_SIZE} bytes) exceeds ${THRESHOLD}MB, splitting into parts..."
            cd "$RUNNER_TEMP/meli-telegram"
            zip -s "${THRESHOLD}m" "${FILENAME}.zip" -j "$FILENAME"
            rm "$FILENAME"
            cd ..
          else
            echo "📦 File size within threshold, no splitting needed."
          fi

      - name: 📤 Commit and push files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/move_outputs.py "$RUNNER_TEMP/meli-telegram" downloads
          git add -- downloads/
          python3 scripts/check_staged_sizes.py
          git diff --cached --quiet || git commit -m "Download Telegram file [skip ci]"
          bash scripts/push_current_branch.sh