name: دانلودر یوتیوب

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL'
        required: true
        type: string

      output_format:
        description: 'نوع خروجی'
        required: true
        type: choice
        options:
          - mp4 (video)
          - mp3 (audio only)
        default: 'mp4 (video)'

      desired_quality:
        description: 'کیفیت (ویدیو: 720p, 1080p | صدا: 192kbps, 320kbps)'
        required: false
        type: string
        default: '720p'

      max_part_mb:
        description: 'حداکثر حجم هر قسمت (MiB)، ریپازیتوری: ۱ تا ۹۵؛ ریلیز: ۱ تا ۱۹۰۰'
        required: false
        type: string
        default: '90'

      upload_method:
        description: '📤 روش ذخیره نهایی'
        required: true
        type: choice
        options:
          - repository (push to repo)
          - release (GitHub Releases)
        default: 'repository (push to repo)'

      release_tag:
        description: '🏷️ نام تگ ریلیز (فقط در صورت انتخاب Release)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  youtube-download:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Validate inputs
        env:
          URL: ${{ inputs.video_url }}
          SIZE: ${{ inputs.max_part_mb }}
          METHOD: ${{ inputs.upload_method }}
        run: |
          MAX_SIZE=95
          if [[ "$METHOD" == release* ]]; then MAX_SIZE=1900; fi
          python3 scripts/validate_workflow.py --url "$URL" --size "$SIZE" --max-size "$MAX_SIZE"

      - name: 🔧 Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zip curl ffmpeg python3 python3-pip
          pip3 install --quiet requests

      - name: 🔗 Get Download Link
        id: retrieve
        run: |
          python3 << 'EOF'
          import os, sys, time, re, requests
          from scripts.validate_workflow import validate_url

          URL  = os.environ.get('INPUT_URL')
          FMT  = os.environ.get('INPUT_FORMAT')
          QUAL = os.environ.get('INPUT_QUALITY')

          is_audio = FMT == 'mp3'
          if is_audio:
              QUAL = QUAL if QUAL in ('64kbps','128kbps','192kbps','320kbps') else '192kbps'
          else:
              QUAL = QUAL if QUAL in ('720p','1080p') else '720p'

          payload = {
              "url": URL,
              "os": "linux",
              "output": {"type": "audio" if is_audio else "video", "format": FMT}
          }
          if is_audio:
              payload["audio"] = {"bitrate": QUAL}
          else:
              payload["output"]["quality"] = QUAL

          s = requests.Session()
          s.headers.update({"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"})
          s.get("https://media.ytmp3.gg/", timeout=30)

          resp = s.post("https://hub.ytconvert.org/api/download", json=payload, timeout=30)
          resp.raise_for_status()
          data = resp.json()

          status_url = data.get('statusUrl')
          title = data.get('title', 'video')
          try:
              validate_url(status_url)
          except ValueError:
              sys.exit("::error::Conversion service returned an invalid status URL")

          dl_url = None
          deadline = time.monotonic() + 300
          while time.monotonic() < deadline:
              time.sleep(2)
              r = s.get(status_url, timeout=20)
              r.raise_for_status()
              status = r.json()
              if status.get('status') == 'completed':
                  dl_url = status.get('downloadUrl')
                  break
              if status.get('status') == 'failed':
                  print("::error::Server failed to prepare the video")
                  sys.exit(1)

          if not dl_url:
              print("::error::Could not get download link")
              sys.exit(1)

          match = re.search(r'(?:v=|youtu\.be/|/shorts/|/embed/)([a-zA-Z0-9_-]{11})', URL)
          if not match:
              sys.exit("::error::Could not determine YouTube video ID")
          vid = match[1]
          try:
              validate_url(dl_url)
          except ValueError:
              sys.exit("::error::Conversion service returned an invalid download URL")
          title = re.sub(r'[\r\n\x00-\x1f\x7f]+', ' ', str(title))[:200]
          clean = re.sub(r'[^a-zA-Z0-9\-_()\[\]]', '_', title.replace(' ', '_'))
          clean = re.sub(r'_+', '_', clean).strip('_')[:70] or vid
          fname = f"{clean}_{vid}_{QUAL}.{FMT}"

          with open(".download_info", "w", encoding="utf-8") as f:
              f.write(f"{dl_url}\n{fname}\n{title}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"filename={fname}\n")
              f.write(f"title={title}\n")
          EOF
        env:
          INPUT_URL:     ${{ github.event.inputs.video_url }}
          INPUT_FORMAT:  ${{ github.event.inputs.output_format == 'mp3 (audio only)' && 'mp3' || 'mp4' }}
          INPUT_QUALITY: ${{ github.event.inputs.desired_quality }}

      - name: 📥 Download File
        env:
          INPUT_FORMAT: ${{ github.event.inputs.output_format == 'mp3 (audio only)' && 'mp3' || 'mp4' }}
        run: |
          DL_URL=$(head -1 .download_info)
          FILENAME=$(sed -n '2p' .download_info)
          # همه فایل‌های نهایی در release_files جمع می‌شن
          mkdir -p release_files
          echo "Downloading: $FILENAME"
          curl -L --fail --progress-bar --proto '=http,https' --proto-redir '=http,https' \
            -o "release_files/$FILENAME" -- "$DL_URL"
          if [ ! -s "release_files/$FILENAME" ]; then
            echo "::error::Downloaded file is empty!"
            exit 1
          fi
          STREAM=a:0
          if [ "$INPUT_FORMAT" = mp4 ]; then STREAM=v:0; fi
          if ! ffprobe -v error -select_streams "$STREAM" -show_entries stream=codec_type \
              -of csv=p=0 "release_files/$FILENAME" | grep -q .; then
            echo "::error::Conversion service did not return the requested media type"
            exit 1
          fi

      - name: ✂️ Split Large File (if needed)
        env:
          WF_STEPS_RETRIEVE_OUTPUTS_FILENAME: ${{ steps.retrieve.outputs.filename }}
          WF_GITHUB_EVENT_INPUTS_MAX_PART_MB: ${{ github.event.inputs.max_part_mb }}
        run: |
          FILENAME="${WF_STEPS_RETRIEVE_OUTPUTS_FILENAME}"
          THRESH_MB="${WF_GITHUB_EVENT_INPUTS_MAX_PART_MB}"
          if [[ "$THRESH_MB" -le 0 ]] || [[ "$THRESH_MB" -gt 1900 ]]; then
            THRESH_MB=1800
          fi
          FILESIZE=$(stat -c%s "release_files/$FILENAME" 2>/dev/null || echo 0)
          THRESH_BYTES=$((THRESH_MB * 1024 * 1024))

          if [ "$FILESIZE" -gt "$THRESH_BYTES" ]; then
            echo "🔪 Splitting into ${THRESH_MB}MB parts..."
            BASE="${FILENAME%.*}"
            # split directly inside release_files
            cd release_files
            zip -r -s "${THRESH_MB}m" "${BASE}.zip" -- "$FILENAME"
            rm -- "$FILENAME"
            cd ..
            echo "Parts created:"
            ls -lh release_files/
          else
            echo "📦 No split needed ($(( FILESIZE / 1024 / 1024 )) MB)"
          fi

      - name: 📅 Get Current Date
        id: get_date
        run: echo "date=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: 📤 Push to Repository
        if: github.event.inputs.upload_method == 'repository (push to repo)'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WF_STEPS_RETRIEVE_OUTPUTS_FILENAME: ${{ steps.retrieve.outputs.filename }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p downloads
          python3 scripts/move_outputs.py release_files downloads
          git add downloads/
          python3 scripts/check_staged_sizes.py
          git diff --cached --quiet || git commit -m "⬇️ YouTube: ${WF_STEPS_RETRIEVE_OUTPUTS_FILENAME} [skip ci]"
          bash scripts/push_current_branch.sh

      - name: 📤 Upload to GitHub Releases
        if: github.event.inputs.upload_method == 'release (GitHub Releases)'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || format('yt-{0}', github.run_number) }}
          name: ${{ format('YouTube - {0}', steps.retrieve.outputs.filename) }}
          body: |
            **📽️ YouTube Download**

            **Title:** ${{ steps.retrieve.outputs.title }}
            **Original Link:** ${{ github.event.inputs.video_url }}
            **Quality:** ${{ github.event.inputs.desired_quality }}
            **Format:** ${{ github.event.inputs.output_format }}
            **Downloaded on:** ${{ steps.get_date.outputs.date }}

            ---
            Powered by Meli-Action ⚡
          files: release_files/*
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false

      - name: 🧹 Cleanup
        if: always()
        run: rm -rf release_files .download_info 2>/dev/null || true
