name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y p7zip-full ffmpeg
      - run: python -m pip install requests pyyaml "playwright==1.65.2" "yt-dlp[default]" "spotdl==4.6.0"
      - run: python -m pip install --no-deps --force-reinstall 'soupsieve @ git+https://github.com/facelessuser/soupsieve.git@7d028fdebbb7261849ee0c2a352b602ef70b7b14'
      - run: python scripts/check_soupsieve.py
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: python -m unittest discover -s tests -v
        env:
          MELI_TEST_BROWSER: '1'
      - run: python scripts/check_workflows.py
